<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Salimos? 💛</title>
    <style>
        body {
            background-color: #b4c6fc; /* Fondo azul/morado como el video */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .card {
            background: #fffdf0;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 3px solid #000; /* Borde marcado del video */
            box-sizing: border-box;
            position: relative;
        }
        .tag-step {
            background: #ffe6a3;
            border: 2px solid #000;
            border-radius: 15px;
            display: inline-block;
            padding: 4px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        h2 { color: #000; font-size: 1.45rem; margin: 10px 0; line-height: 1.3; }
        
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            height: 90px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            border: 2px solid #000;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        
        #btnSi { background-color: #a3fca3; color: #000; transition: transform 0.1s ease; }
        #btnNo { background-color: #fca3a3; color: #000; position: relative; z-index: 5; }
        
        .cat-container { font-size: 70px; margin: 15px 0; height: 90px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="card">
        <span class="tag-step">Pregunta Seria</span>
        <div class="cat-container" id="memeGato">🥺</div>
        <h2>¿Quieres acompañarme a hacer algo divertido juntos?</h2>
        
        <div class="btn-container">
            <!-- Al presionar Sí, de momento solo saldrá un aviso para probar si responde -->
            <button id="btnSi" onclick="alert('¡Excelente! El botón Sí funciona. Avísame para darte el siguiente paso.')">Sí</button>
            <button id="btnNo" onclick="accionNo()" onmouseover="accionNo()">No</button>
        </div>
    </div>

    <script>
        let escalaSi = 1;
        let conteoNo = 0;
        const memesTristes = ["😾", "😿", "🐱💢", "😭", "🙀", "💔"];

        function accionNo() {
            conteoNo++;
            const btnNo = document.getElementById('btnNo');
            const btnSi = document.getElementById('btnSi');
            const memeGato = document.getElementById('memeGato');
            
            // Hace crecer el botón SÍ
            escalaSi += 0.3;
            btnSi.style.transform = `scale(${escalaSi})`;
            
            // Cambia el emoji del gatito triste
            memeGato.innerText = memesTristes[conteoNo % memesTristes.length];
            
            // Mueve el botón NO dentro de un espacio seguro para evitar que se congele
            const randomX = (Math.random() - 0.5) * 160;
            const randomY = (Math.random() - 0.5) * 80;
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }
    </script>
</body>
</html>
