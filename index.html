<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi GameHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1f1f1f;
            padding: 1rem;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .game-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            gap: 1rem;
        }
        .game-item {
            background: #282828;
            border-radius: 8px;
            cursor: pointer;
            width: 180px;
            text-align: center;
            transition: transform 0.3s;
        }
        .game-item:hover {
            transform: scale(1.05);
        }
        .game-item img {
            width: 100%;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .game-item p {
            margin: 0.5rem 0;
            padding: 0 0.5rem;
        }
        #game-container {
            position: fixed;
            top: 50px;
            left: 10%;
            width: 80%;
            height: 80%;
            background: black;
            border: 3px solid #09f;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }
        #game-container iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            border-radius: 0 0 10px 10px;
        }
        #close-btn {
            background: #09f;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <header>Mi GameHub</header>
    <div class="game-list">
        <div class="game-item" onclick="openGame('https://example.com/game1')">
            <img src="https://via.placeholder.com/180x100.png?text=Juego+1" alt="Juego 1">
            <p>Juego 1</p>
        </div>
        <div class="game-item" onclick="openGame('https://example.com/game2')">
            <img src="https://via.placeholder.com/180x100.png?text=Juego+2" alt="Juego 2">
            <p>Juego 2</p>
        </div>
        <div class="game-item" onclick="openGame('https://example.com/game3')">
            <img src="https://via.placeholder.com/180x100.png?text=Juego+3" alt="Juego 3">
            <p>Juego 3</p>
        </div>
    </div>

    <div id="game-container">
        <button id="close-btn" onclick="closeGame()">Cerrar</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function openGame(url) {
            const container = document.getElementById('game-container');
            const frame = document.getElementById('game-frame');
            frame.src = url;
            container.style.display = 'flex';
        }
        function closeGame() {
            const container = document.getElementById('game-container');
            const frame = document.getElementById('game-frame');
            frame.src = '';
            container.style.display = 'none';
        }
    </script>
</body>
</html>
