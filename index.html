<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 💛</title>
    <style>
        body {
            background-color: #b4c6fc; /* Fondo azul del video */
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fffdf0;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #000;
            max-width: 350px;
            width: 100%;
        }
        .gato {
            font-size: 70px;
            margin-bottom: 10px;
        }
        .pregunta {
            background: #ffe6a3;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 5px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-block;
        }
        h2 { font-size: 1.4rem; color: #000; margin: 15px 0; }
        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            height: 80px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            border: 2px solid #000;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        #si { background-color: #a3fca3; }
        #no { background-color: #fca3a3; position: relative; }
    </style>
</head>
<body>

    <div class="card">
        <div class="pregunta">PREGUNTA SERIA</div>
        <!-- Inicio con gatos saludando como en el video -->
        <div class="gato" id="gatoMeme">🐱👋</div>
        <h2>¿Quieres acompañarme a hacer algo divertido juntos?</h2>
        
        <div class="botones">
            <button id="si" onclick="alert('¡Perfecto! El botón SÍ respondió. Avísame para poner el paso 2.')">Sí</button>
            <button id="no" onclick="moverNo()" onmouseover="moverNo()">No</button>
        </div>
    </div>

    <script>
        let tamanoSi = 1;
        // Lista de gatitos del video según presiona "No"
        const gatosVideo = ["🐱👓", "🙀", "😾", "😭", "🐈🐾"];
        let clickNo = 0;

        function moverNo() {
            clickNo++;
            const btnNo = document.getElementById('no');
            const btnSi = document.getElementById('si');
            const gato = document.getElementById('gatoMeme');

            // Hacer crecer el botón SÍ
            tamanoSi += 0.3;
            btnSi.style.transform = `scale(${tamanoSi})`;

            // Cambiar los gatitos del video
            gato.innerText = gatosVideo[clickNo % gatosVideo.length];

            // Movimiento básico ultra-seguro para que no se congele en celular
            const x = (Math.random() - 0.5) * 140;
            const y = (Math.random() - 0.5) * 60;
            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>
</body>
</html>
