<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Salimos? 💛</title>
    <style>
        body {
            background-color: #b4c6fc;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fffdf0;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 3px solid #000;
        }
        .tag-step {
            background: #ffe6a3;
            border: 2px solid #000;
            border-radius: 15px;
            display: inline-block;
            padding: 4px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        h2 { color: #000; font-size: 1.4rem; margin: 10px 0; }
        p { font-size: 1.05rem; color: #333; }
        
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            height: 90px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            border: 2px solid #000;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        #btnSi { background-color: #a3fca3; }
        #btnNo { background-color: #fca3a3; position: relative; }
        
        .step { display: none; }
        .step.active { display: block; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid #000;
            font-size: 1rem;
            font-weight: bold;
            box-sizing: border-box;
        }
        .info-msg { color: #444; font-size: 0.9rem; font-weight: bold; margin-top: 10px; background: #fff4ca; padding: 8px; border-radius: 8px; border: 1px dashed #000; }
        .cat-container { font-size: 70px; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <!-- PASO 1: PORTADA -->
        <div id="step1" class="step active">
            <span class="tag-step">Pregunta Seria</span>
            <div class="cat-container" id="gatoMeme">🐱👋</div>
            <h2>¿Quieres acompañarme a hacer algo divertido juntos?</h2>
            <div class="btn-container">
                <button id="btnSi" onclick="irAlPaso2()">Sí</button>
                <button id="btnNo" onclick="accionNo()" onmouseover="accionNo()">No</button>
            </div>
        </div>

        <!-- PASO 2: FECHA Y HORA -->
        <div id="step2" class="step">
            <span class="tag-step">Paso 1</span>
            <div class="cat-container">😺🎉</div>
            <h2>¡Listo! El plan principal lo armo yo...</h2>
            <p>Pero tú elige las siguientes opciones:</p>
            <p style="font-weight: bold;">1 - Elige el día y la hora:</p>
            
            <input type="date" id="fechaCita" min="2026-10-01" value="2026-10-01" onchange="validarHorario()">
            <select id="horaCita"></select>
            <div class="info-msg" id="errorHora"></div>
            
            <button style="background-color: #ffe600; width: 100%; margin-top: 15px;" onclick="alert('¡Paso 2 completado con éxito! Avísame para darte la comida.')">Siguiente ➔</button>
        </div>
    </div>

    <script>
        let tamanoSi = 1;
        let clickNo = 0;
        const gatosVideo = ["🐱👓", "🙀", "😾", "😭", "🐈🐾"];

        function accionNo() {
            clickNo++;
            const btnNo = document.getElementById('btnNo');
            const btnSi = document.getElementById('btnSi');
            const gato = document.getElementById('gatoMeme');
            
            tamanoSi += 0.3;
            btnSi.style.transform = "scale(" + tamanoSi + ")";
            gato.innerText = gatosVideo[clickNo % gatosVideo.length];
            
            const randomX = (Math.random() - 0.5) * 140;
            const randomY = (Math.random() - 0.5) * 60;
            btnNo.style.transform = "translate(" + randomX + "px, " + randomY + "px)";
        }

        function irAlPaso2() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            validarHorario();
        }

        function validarHorario() {
            const fechaInput = document.getElementById('fechaCita').value;
            const horaSelect = document.getElementById('horaCita');
            const errorHora = document.getElementById('errorHora');
            
            if (!fechaInput) return;
            
            const fechaObj = new Date(fechaInput + "T00:00:00");
            const diaSemana = fechaObj.getDay(); 
            
            let horaInicio = 0;
            let mensaje = "";

            if (diaSemana >= 1 && diaSemana <= 5) {
                horaInicio = 20; 
                mensaje = "⏰ Entre semana (Lunes a Viernes) disponible a partir de las 8:00 PM";
            } else if (diaSemana === 6) {
                horaInicio = 15; 
                mensaje = "⏰ Los Sábados disponible a partir de las 3:00 PM";
            } else if (diaSemana === 0) {
                horaInicio = 0; 
                mensaje = "⏰ ¡Domingos con horario completamente libre!";
            }

            errorHora.innerText = mensaje;
            horaSelect.innerHTML = "";
            
            for (let i = horaInicio; i < 24; i++) {
                let ampm = i >= 12 ? 'PM' : 'AM';
                let hora12 = i % 12;
                hora12 = hora12 ? hora12 : 12;
                
                let text1 = hora12 + ":00 " + ampm;
                let val1 = (i < 10 ? "0" : "") + i + ":00";
                horaSelect.options.add(new Option(text1, val1));
            }
        }
    </script>
</body>
</html>
